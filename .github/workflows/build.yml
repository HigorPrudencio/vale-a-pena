name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk ValeAPena.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vale a Pena v${{ github.run_number }}
          files: ValeAPena.apk
          body: |
            ## Vale a Pena v${{ github.run_number }}

            **[👉 Baixar ValeAPena.apk](https://github.com/HigorPrudencio/vale-a-pena/releases/download/v${{ github.run_number }}/ValeAPena.apk)**

            1. Abra o link no celular Android e instale
            2. Já tinha o app? Instale por cima, seus dados continuam salvos
            3. Abra o app e confira se os 3 itens da **Configuração** estão ligados

            Passo a passo completo na [página do app](https://github.com/HigorPrudencio/vale-a-pena#readme).
